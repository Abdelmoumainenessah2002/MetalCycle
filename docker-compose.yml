services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: myapp_laravel

    ports:
      - "8080:80"

    env_file:
      - .env

    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped